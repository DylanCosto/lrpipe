# Clair3's models (PyTorch checkpoints, as Clair3 2.0 and lrpipe-snv read them), read after each
# genome's manifest. Each model is a directory under models/ named as Clair3 names it, holding
# pileup.pt and full_alignment.pt; `lrpipe setup` fetches the models of the --platform chosen,
# and writes [models]' one for each platform as site.toml's ont_model and hifi_model.
#
# HKU publishes no checksums for them: they are unpinned, checked by size alone, until
# `lrpipe setup --pin`.

[models]
ont = "r1041_e82_400bps_sup_v500"
hifi = "hifi_revio"

