[package]
name = "lrpipe-methyl"
description = "Base modification pileups (5mC, 5hmC, 6mA) from long reads, ONT and PacBio, in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lrpipe-methyl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
pasta.workspace = true
lrpipe-reads.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
