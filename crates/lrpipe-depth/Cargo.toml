[package]
name = "lrpipe-depth"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
description = "Binned read depth from BAM/CRAM in pure Rust, with output identical to mosdepth"
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "coverage", "depth", "mosdepth", "genomics"]
categories = ["science", "command-line-utilities"]
exclude = ["/tests/data", "/tools"]

[[bin]]
name = "lrpipe-depth"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
pasta.workspace = true
lrpipe-reads.workspace = true

[dev-dependencies]
sha2 = "0.10.9"
